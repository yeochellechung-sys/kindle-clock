<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Kindle 8 Clock</title>
<style>
html,body {
  margin:0;
  padding:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:white;
  color:black;
  font-family:Arial,sans-serif;
}
#clock {
  position:absolute;
  left:50%;
  top:50%;
  width:800px;
  height:600px;
  text-align:center;
  background:white;
  -webkit-transform-origin:center center;
  transform-origin:center center;
}
#content {
  position:absolute;
  left:0;
  top:50%;
  width:100%;
  margin-top:-115px;
}
#time {
  font-size:190px;
  font-weight:bold;
  line-height:1.1;
  white-space:nowrap;
}
#date {
  font-size:38px;
  margin-top:22px;
  white-space:nowrap;
}
</style>
</head>
<body>
<div id="clock">
  <div id="content">
    <div id="time">00:00</div>
    <div id="date">2026.10.24 星期六</div>
  </div>
</div>
<script>
var days=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];

function pad(n) {
  return n<10?"0"+n:""+n;
}

function updateClock() {
  var d=new Date();
  document.getElementById("time").innerHTML=
    pad(d.getHours())+":"+pad(d.getMinutes());
  document.getElementById("date").innerHTML=
    d.getFullYear()+"."+
    pad(d.getMonth()+1)+"."+
    pad(d.getDate())+" "+
    days[d.getDay()];
}

function layout() {
  var w=window.innerWidth;
  var h=window.innerHeight;
  var portrait=h>w;
  var cw=portrait?h:w;
  var ch=portrait?w:h;
  var scale=Math.min(cw/800,ch/600);
  var clock=document.getElementById("clock");
  var content=document.getElementById("content");

  clock.style.width="800px";
  clock.style.height="600px";
  clock.style.marginLeft="-400px";
  clock.style.marginTop="-300px";

  var angle=portrait?90:0;
  var transform="rotate("+angle+"deg) scale("+scale+")";
  clock.style.webkitTransform=transform;
  clock.style.transform=transform;

  content.style.marginTop="-115px";
}

updateClock();
layout();
setInterval(updateClock,1000);
window.onresize=layout;
</script>
</body>
</html>
