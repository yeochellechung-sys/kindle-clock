<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kindle 8 Clock</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:white;color:black;font-family:Arial,sans-serif}
#clock{position:absolute;left:50%;top:50%;text-align:center;white-space:nowrap}
#time{font-size:105px;font-weight:bold;line-height:1.2}
#date{font-size:28px;margin-top:20px}
</style>
</head>
<body>
<div id="clock">
<div id="time">00:00</div>
<div id="date">2026.10.24 星期六</div>
</div>
<script>
var days=["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function pad(n){return n<10?"0"+n:""+n}
function update(){
var d=new Date();
document.getElementById("time").innerHTML=pad(d.getHours())+":"+pad(d.getMinutes());
document.getElementById("date").innerHTML=d.getFullYear()+"."+pad(d.getMonth()+1)+"."+pad(d.getDate())+" "+days[d.getDay()];
}
function layout(){
var w=window.innerWidth,h=window.innerHeight;
var c=document.getElementById("clock");
var portrait=h>w;
var cw=portrait?h:w,ch=portrait?w:h;
var scale=Math.min(cw/800,ch/600);
c.style.width=cw+"px";
c.style.left=(w/2)+"px";
c.style.top=(h/2)+"px";
c.style.marginLeft=(-cw/2)+"px";
c.style.marginTop=(-ch/2)+"px";
c.style.height=ch+"px";
c.style.webkitTransform=portrait?"rotate(90deg)":"none";
c.style.transform=portrait?"rotate(90deg)":"none";
document.getElementById("time").style.fontSize=Math.round(105*scale)+"px";
document.getElementById("date").style.fontSize=Math.round(28*scale)+"px";
}
update();layout();setInterval(update,1000);window.onresize=layout;
</script>
</body>
</html>
